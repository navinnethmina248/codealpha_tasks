<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - TaskFlow</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login" class="auth-page">
  <div class="auth-box">
    <a class="brand" href="index.html"><img src="assets/icons/favicon.svg" alt="" width="32" height="32"> TaskFlow</a>
    <h1>Welcome back</h1>
    <p class="muted">Login to continue to your projects.</p>

    <form id="loginForm" novalidate>
      <div class="form-error" hidden></div>
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Your password" required autocomplete="current-password">
      </label>
      <button class="btn btn-block" type="submit">Login</button>
    </form>

    <p class="muted center">No account yet? <a href="register.html">Register</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
