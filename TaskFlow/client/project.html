<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project - TaskFlow</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/project.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="project" data-protected>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="dashboard.html"><img src="assets/icons/favicon.svg" alt="" width="28" height="28"> TaskFlow</a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <div class="notif-wrap">
          <button id="bellBtn" class="icon-btn" title="Notifications">&#128276;<span id="notifBadge" class="badge" hidden>0</span></button>
          <div id="notifPanel" class="notif-panel" hidden>
            <div class="notif-head"><strong>Notifications</strong><button id="markAllRead" class="link-btn small">Mark all read</button></div>
            <div id="notifList"></div>
          </div>
        </div>
        <span id="navUser" class="nav-user"></span>
        <button id="logoutBtn" class="btn btn-sm btn-ghost">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container wide">
    <a href="dashboard.html" class="back">&larr; All projects</a>

    <div class="page-head">
      <div>
        <h1 id="projectName">Loading...</h1>
        <p id="projectDesc" class="muted"></p>
      </div>
      <div class="head-actions">
        <div id="ownerActions" hidden>
          <button id="editProjectBtn" class="btn btn-ghost btn-sm">Edit</button>
          <button id="deleteProjectBtn" class="btn btn-danger btn-sm">Delete</button>
        </div>
        <button class="btn" data-add-task="todo">+ New task</button>
      </div>
    </div>

    <div class="project-layout">
      <section>
        <div class="filters">
          <input type="search" id="filterSearch" placeholder="Search tasks...">
          <select id="filterPriority">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <label class="check"><input type="checkbox" id="filterMine"> My tasks</label>
        </div>

        <div class="board" id="board">
          <div class="column">
            <div class="column-head"><h3>To Do <span class="count" id="count-todo">0</span></h3><button class="icon-btn" data-add-task="todo" title="Add task">+</button></div>
            <div class="task-list" id="list-todo" data-status="todo"></div>
          </div>
          <div class="column">
            <div class="column-head"><h3>In Progress <span class="count" id="count-in_progress">0</span></h3><button class="icon-btn" data-add-task="in_progress" title="Add task">+</button></div>
            <div class="task-list" id="list-in_progress" data-status="in_progress"></div>
          </div>
          <div class="column">
            <div class="column-head"><h3>Done <span class="count" id="count-done">0</span></h3><button class="icon-btn" data-add-task="done" title="Add task">+</button></div>
            <div class="task-list" id="list-done" data-status="done"></div>
          </div>
        </div>
      </section>

      <aside class="side-panel">
        <h3>Team</h3>
        <ul id="memberList" class="member-list"></ul>
        <form id="addMemberForm" class="add-member" hidden>
          <input type="email" name="email" placeholder="Add member by email" required>
          <button class="btn btn-sm" type="submit">Add</button>
        </form>
      </aside>
    </div>
  </main>

  <!-- Task modal (create / edit + comments) -->
  <div class="modal" id="taskModal" hidden>
    <div class="modal-box large">
      <div class="modal-head"><h3 id="taskModalTitle">New task</h3><button class="icon-btn" data-close-modal>&times;</button></div>
      <div class="task-modal-body">
        <form id="taskForm">
          <label>Title <input type="text" name="title" maxlength="120" required></label>
          <label>Description <textarea name="description" rows="4" maxlength="1000"></textarea></label>
          <div class="form-row">
            <label>Status
              <select name="status">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </label>
            <label>Priority
              <select name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label>Due date <input type="date" name="dueDate"></label>
            <label>Assignee <select name="assignee"></select></label>
          </div>
          <div class="modal-actions">
            <button type="button" id="deleteTaskBtn" class="btn btn-danger" hidden>Delete</button>
            <span class="spacer"></span>
            <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
            <button type="submit" class="btn">Save</button>
          </div>
        </form>

        <div id="commentsSection" hidden>
          <h4>Comments</h4>
          <div id="commentList" class="comment-list"></div>
          <form id="commentForm" class="comment-form">
            <input type="text" name="text" maxlength="1000" placeholder="Write a comment..." autocomplete="off">
            <button class="btn btn-sm" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit project modal -->
  <div class="modal" id="editProjectModal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>Edit project</h3><button class="icon-btn" data-close-modal>&times;</button></div>
      <form id="editProjectForm">
        <label>Name <input type="text" name="name" maxlength="80" required></label>
        <label>Description <textarea name="description" rows="3" maxlength="500"></textarea></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/project.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/comments.js"></script>
</body>
</html>
