<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - TaskFlow</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="profile" data-protected>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="dashboard.html"><img src="assets/icons/favicon.svg" alt="" width="28" height="28"> TaskFlow</a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html" class="active">Profile</a>
        <div class="notif-wrap">
          <button id="bellBtn" class="icon-btn" title="Notifications">&#128276;<span id="notifBadge" class="badge" hidden>0</span></button>
          <div id="notifPanel" class="notif-panel" hidden>
            <div class="notif-head"><strong>Notifications</strong><button id="markAllRead" class="link-btn small">Mark all read</button></div>
            <div id="notifList"></div>
          </div>
        </div>
        <span id="navUser" class="nav-user"></span>
        <button id="logoutBtn" class="btn btn-sm btn-ghost">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <div class="profile-head">
      <span id="profileAvatar" class="avatar xl"></span>
      <h1 id="profileName"></h1>
    </div>

    <section class="card">
      <h3>Your details</h3>
      <form id="profileForm">
        <label>Name <input type="text" name="name" required></label>
        <label>Email <input type="email" name="email" disabled></label>
        <label>Bio <textarea name="bio" rows="3" maxlength="200" placeholder="Tell your team a little about yourself"></textarea></label>
        <button class="btn" type="submit">Save changes</button>
      </form>
    </section>

    <section class="card">
      <h3>Change password</h3>
      <form id="passwordForm">
        <label>Current password <input type="password" name="currentPassword" required autocomplete="current-password"></label>
        <label>New password <input type="password" name="newPassword" minlength="6" required autocomplete="new-password"></label>
        <label>Confirm new password <input type="password" name="confirmPassword" required autocomplete="new-password"></label>
        <button class="btn" type="submit">Update password</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
