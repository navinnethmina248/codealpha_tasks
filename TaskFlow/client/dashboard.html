<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - TaskFlow</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="dashboard" data-protected>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="dashboard.html"><img src="assets/icons/favicon.svg" alt="" width="28" height="28"> TaskFlow</a>
      <nav class="nav-links">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="profile.html">Profile</a>
        <div class="notif-wrap">
          <button id="bellBtn" class="icon-btn" title="Notifications">&#128276;<span id="notifBadge" class="badge" hidden>0</span></button>
          <div id="notifPanel" class="notif-panel" hidden>
            <div class="notif-head"><strong>Notifications</strong><button id="markAllRead" class="link-btn small">Mark all read</button></div>
            <div id="notifList"></div>
          </div>
        </div>
        <span id="navUser" class="nav-user"></span>
        <button id="logoutBtn" class="btn btn-sm btn-ghost">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="greeting">Hi</h1>
        <p class="muted">Here's what's happening across your projects.</p>
      </div>
      <button id="newProjectBtn" class="btn">+ New project</button>
    </div>

    <section class="stats">
      <div class="stat"><span id="statProjects">0</span><label>Projects</label></div>
      <div class="stat"><span id="statOpen">0</span><label>Open tasks</label></div>
      <div class="stat"><span id="statDone">0</span><label>Completed</label></div>
    </section>

    <h2>Your projects</h2>
    <div id="projectGrid" class="project-grid"><p class="muted">Loading...</p></div>
  </main>

  <div class="modal" id="projectModal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>New project</h3><button class="icon-btn" data-close-modal>&times;</button></div>
      <form id="projectForm">
        <label>Name <input type="text" name="name" maxlength="80" required></label>
        <label>Description <textarea name="description" rows="3" maxlength="500"></textarea></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn">Create project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
