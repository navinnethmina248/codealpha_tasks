{% extends 'base.html' %}
{% block title %}Register - ShopEase{% endblock %}

{% block content %}
<div class="form-box">
  <h1>Create an account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
