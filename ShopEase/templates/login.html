{% extends 'base.html' %}
{% block title %}Login - ShopEase{% endblock %}

{% block content %}
<div class="form-box">
  <h1>Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="muted">No account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
