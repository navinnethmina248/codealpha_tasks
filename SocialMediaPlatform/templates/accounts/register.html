{% extends 'base.html' %}
{% load static %}
{% block title %}Register - Friendzy{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}

{% block content %}
<div class="auth-box">
  <img src="{% static 'images/logo.png' %}" alt="" width="64" height="64">
  <h1>Join the community</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn block" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
