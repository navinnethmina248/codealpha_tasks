{% load static %}
<header class="navbar">
  <div class="container nav-inner">
    <a class="brand" href="{% url 'feed' %}">
      <img src="{% static 'images/logo.png' %}" alt="" width="32" height="32">
      <span>Friendzy</span>
    </a>
    <nav class="nav-links">
      {% if user.is_authenticated %}
        <a href="{% url 'feed' %}" class="{% if request.resolver_match.url_name == 'feed' %}active{% endif %}">Home</a>
        <a href="{% url 'create_post' %}" class="nav-create {% if request.resolver_match.url_name == 'create_post' %}active{% endif %}">Post</a>
        <a href="{% url 'profile' user.username %}" class="nav-profile {% if request.resolver_match.url_name == 'profile' and owner.username == user.username %}active{% endif %}">@{{ user.username }}</a>
        <form class="inline" action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button type="submit" class="link-btn">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>
  </div>
</header>
